<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<!-- Bez tej linijki telefon pokazuje stronę pomniejszoną, jak na komputerze -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car Note</title>
<!-- PWA: „wizytówka” aplikacji, ikony i kolor paska na telefonie -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <!-- Logo: ta sama ikona co na ekranie telefonu (icons/icon.svg) -->
      <span class="brand-mark"><img src="icons/icon.svg" alt="" width="40" height="40"></span>
      <h1>Car Note</h1>
    </div>
  </header>

  <nav class="vehicle-tabs" id="vehicleTabs"></nav>

  <main id="main"></main>

  <!-- Stopka: informacja, gdzie zapisują się dane (tekst ustawia app.js) -->
  <footer class="app-footer">
    <div class="mode-badge" id="modeBadge" data-m="demo"><span class="mode-dot"></span><span id="modeBadgeText">Ładowanie…</span></div>
  </footer>
</div>

<div id="modalRoot"></div>

<!-- Skrypt na końcu, żeby elementy strony już istniały, gdy się uruchomi -->
<script src="app.js"></script>
</body>
</html>
